<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Frontend Mentor | Blog preview card</title>

  
  <style>

    body {
      margin: auto;
      min-height: 100vh;
      max-width: 1440px;
      display: flex;
      flex-direction: column;
      background-color: hsl(47, 88%, 63%);
    }

    img {
      display: block;
      max-width: 100%;
      height: auto;
    }

    .inner-container {
      width: 100%;
    }

    #blog-card-container {
      display: flex;
      flex-direction: column;
      width: min(100%, 384px);
      box-sizing: border-box;
      margin: auto;
      background-color: hsl(0, 0%, 100%);
      border-radius: 20px;
      border: 1px solid black;
      font-family: "Figtree",sans-serif;
      padding: 20px; 
      box-shadow: 8px 8px 0px black;
    }

  

    .user-container {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      color: hsl(0, 0%, 7%);
    }

    .user-img {
      max-height: 30px;
    }

    .user-img:hover {
      max-height: 40px;
    }

    .user-name:hover {
      transform: scale(1.2);
      transform-origin: left;
    }

    h1 {
      font-size: 14px;
      background-color: hsl(47, 88%, 63%);
      width: fit-content;
      padding: 5px 14px;
      border-radius: 4px;
      color: hsl(0, 0%, 7%);
      font-weight: 800;
      margin-top: 25px;
    }

    p {
      margin-top: 0;
      font-size: 16px;
      font-weight: 500;
      line-height: 25px;
    }

    h2 {
      font-weight: 800;
    }

    

    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>
  <main id="blog-card-container">
    <section class="inner-container">
      <div class="img-container">
        <img src="./assets/images/illustration-article.svg" alt="" style="border-radius: 12px; ">
      </div>
      <section class="text-container">
        <div class="card-tag">
          <h1>Learning</h1>
        <div>
          <p style="color: hsl(0, 0%, 7%);">Published 21 Dec 2023</p>
        </div>
          <h2>HTML & CSS foundations</h2>
        </div>
        <div>
          <p style="color: hsl(0, 0%, 42%);">These languages are the backbone of every website, defining structure, content, and presentation.</p>
        </div>
        <div class="user-container">
          <a href=""><img class="user-img" src="./assets/images/image-avatar.webp" alt=""></a>
          <h3 class="user-name"><a href="">Greg Hooper</a></h3>
        </div>
      </section> 
    </section> 
  </main>
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Your Name Here</a>.
  </footer>
</body>
</html>
