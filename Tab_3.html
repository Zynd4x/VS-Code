<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        table {
            border: 2px solid black;
        }

        th, td {
            border: 1px solid black;
            text-align: center;
        }

        .Lebensmittel {
            background-color: orange;
        }

        .Sport {
            background-color: green;
            color: white;
        }

        .Marketing {
            background-color: blue;
            color: white
        }

        .Quartal {
            background-color: grey;
            color: white;
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <th colspan="4" class="Marketing">Marketing</th>
        </tr>
        <tr class="Quartal">
            <td>Quartal 1</td>
            <td>Quartal 2</td>
            <td>Quartal 3</td>
            <td>Quartal 4</td>
        </tr>
        <tr>
            <td colspan="2">Automobil</td>
            <td rowspan="3" class="Sport">Sport</td>
            <td rowspan="5" class="Lebensmittel">Lebensmittel</td>
        </tr>
        <tr>
            <td colspan="2">Kosmetik</td>
        </tr>
        <tr>
            <td>Tier</td>
            <td>Bücher</td>
        </tr>
        <tr>
            <td colspan="2">Audio</td>
            <td>Video</td>
        </tr>
        <tr>
            <td colspan="3">Geschenk</td>
        </tr>
    </table>
</body>
</html>
